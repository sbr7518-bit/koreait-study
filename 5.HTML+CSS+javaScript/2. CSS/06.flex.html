<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>

        /* .container {
            width: 100%;
            height: 300px;
            display: flex; */

            /* flex-direction : 요소들의 진행 반향을 선정해주는 속성 (flex-start 가 기본값)
                ex. 가로: row, row-reverse(반대방향), 세로: column, column-reverse (반대방향)
            */
            /* flex-direction: row; */

            /* justify-content : 요소 위치 선정해주는 속성 (flex-start 가 기본값) 
                ex. flex(start,end), space-between, space-around(첫번째와 마지막요소의 간격을 반으로 만듬),
                    space-evenly(모든 요소 간격을 일정 간격으로 조정), center 등
            */
            /* justify-content: space-evenly; */
            
            /* align-items : 요소 안에 있는 텍스트 내용들을 정렬해주는 속성.
                ex. stretch, flex-end, center, 
                (last)baseline (요소들의 문자 기준선(글자타입이 서로 다름)에 맞춰 정렬) 등 
            */
            /* align-items: center;

        } */

        /* 로그인 요소(텍스트 내용까지)를 화면에서 정 가운데로 정하고 싶을 때 사용 */
        /* main {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        } */

        .container {
            display: flex;
        }

        .flex-item {
            background-color: antiquewhite;
            padding: 20px;
            margin: 5px;
        }

        .item1 {
            /* width: 300px; */
            /* flex타입으로 진행할 땐 flex타입 속성들 사용하기 */
            /* flex-basis: 300px; */
            /* flex-shrink : 화면을 줄일 때 요소가 줄어드는 속도 조정 */
            flex-shrink: 5;
            /* flex-grow :         flex 공간 안에 남은 공간들을 어떻게 배분할 건지 조정해주는 속성 */
            flex-grow: 1;
        }

        .item2 {
            /* width: 300px; */
            /* flex타입으로 진행할 땐 flex타입 속성들 사용하기 */
            /* flex-basis: 300px; */
            flex-shrink: 3;
            flex-grow: 2;
        }

        .item3 {
            flex-grow: 3;
        }


    </style>
</head>
<body>
    
    <!-- <div class="container">
        <div class="banner">Banner</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>        
    </div> -->

    <!-- <main>
        <div>로그인</div>
    </main> -->

    <div class="container">
        <!-- 부모 안에 자식태그 만들기 [ul>li*3] -->
        <!-- 선택자 한번에 만들기 [div.flex-item.item*3] -->
        <div class="flex-item item1">item1</div>
        <div class="flex-item item2">item2</div>
        <div class="flex-item item3">item3</div>        

    </div>







</body>
</html>
