<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            width: 100%;
            height: 300px;
            display: flex;

            /* flex-direction : 요소들의 진행 반향을 선정해주는 속성 
                ex. 가로: row, row-reverse, 세로: column, column-reverse 
            */
            flex-direction: row;

            /* justify-content : 요소 위치 선정해주는 속성 
                ex. flex, space-between, space-around, center 등
            */
            /* justify-content: space-around; */
            
            /* align-items : 요소들을 세로 방향으로 정렬해주는 속성
                ex. stretch, flex-end, center 
            */
            align-items: center;

        }

        /* 로그인 요소를 화면에서 정 가운데로 정하고 싶을 때 사용 */
        main {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }



    </style>
</head>
<body>
    
    <!-- <div class="container">
        <div class="banner">Banner</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>        
    </div> -->

    <main>
        <div>로그인</div>
    </main>

</body>
</html>
