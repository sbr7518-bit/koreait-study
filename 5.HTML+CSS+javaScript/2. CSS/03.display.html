<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div {
            width: 50px;
            border: 10px double black;
            overflow: scroll;
            /* 시계방향으로 값 적용 */
            /* 
            padding: 10px 7px 5px 3px;
            margin: 20px 15px 20px 10px; */
        }
        p {
            display: inline-block;
        }
        span {
            display: block;
        }
        strong {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 블록 -->
    <div>div 태그 
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    </div>
    <p>p 태그</p>
    <h3>h3 태그</h3>

    <hr>

    <!-- 인라인 -->
    <span>span 태그</span>
    <a href="">a 태그</a>
    <strong>strong 태그</strong>
    
</body>
</html>
