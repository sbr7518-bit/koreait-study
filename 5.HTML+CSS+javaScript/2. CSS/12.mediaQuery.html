<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: black;
        }

        /* max(최대) width(가로길이)가 0px~768px 될 때까지 안에 있는 CSS를 적용하겠다. */
        @media (max-width: 768px) {
            div {
                background-color: aquamarine;
            }
        }

        /* min(최소) width(가로길이)가 1024px ~ 이상이 되면 안에 있는 CSS를 적용 */
        @media (min-width: 1024px) {
            div {
                background-color: blueviolet;
            }
        }
    </style>
</head>
<body>
    <div>Box</div>
</body>
</html>
