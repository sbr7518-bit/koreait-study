<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DashBoard</title>
    <style>

        /* 색상을 변수처럼 만들기 :var(--body~) */
        :root {
            --body-color: #f4f6f9;
        }

        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: var(--body-color);
            padding: 40px;
        }

        /* Header 디자인 */
        header {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Card 디자인 */
        .container {
            display: flex;
            height: 100px;
            /* flex 안에 있는 요소(아이템들)간의 간격을 만드는 속성 */
            gap: 20px;
            /* 줄바꿈 여부 (nowrap은 줄바꿈 안함, wrap은 줄바꿈) */
            flex-wrap: wrap;
        }

        .card {
            padding: 25px;
            /* 테두리 둥글게 만들기 */
            border-radius: 10px;
            /* 늘리기 */
            flex-grow: 1;
            /* 줄이기 */
            flex-shrink: 1;
            /* 화면에서 부여받은 25%(100/25=4칸)에서 
               20px를 뺀 만큼만 크기를 가짐 -> 실제크기 : 80px */
            flex-basis: calc(20% - 20px);
            background-color: white;
            /* 그림자 효과 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            color: #555;
            font-weight: 700;
        }

        .number {
            color: black;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 32px;
            margin: 10px 0;
        }

        .discription{
            color: #888;
            font-size: 12px;
        }


    </style>
</head>
<body>
    <header>Admin DashBoard</header>

    <div class="container">
        <div class="card">
            <p class="title">Total Users</p>
            <p class="number">1,245</p>
            <p class="discription">active this month</p>
        </div>
        <div class="card">
            <p class="title">Rebenue</p>
            <p class="number">12,430</p>
            <p class="discription">this month</p>
        </div>
        <div class="card">
            <p class="title">Orders</p>
            <p class="number">320</p>
            <p class="discription">Completed</p>
        </div>
        <div class="card">
            <p class="title">New Singups</p>
            <p class="number">89</p>
            <p class="discription">Today</p>
        </div>
    </div>
        
</body>
</html>
