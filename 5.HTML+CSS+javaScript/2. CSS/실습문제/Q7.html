<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCompany</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* 상단 메뉴 */
        header {
            background-color: #111;
            padding: 16px 24px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .menu a:hover {
            opacity: 1;
        }

        /* 카드 */
        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            justify-content: center;
        }

        .card {
            margin: 0;
            height: 110px;
            background-color: #f4f4f4;
            border-radius: 10px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            flex: 1 1 300px;
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav">
            <div class="logo">My Company</div>

            <div class="menu">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Service</a>         
                <a href="#">Contact</a>         
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="cards">
                <p class="card">Service 1</p>
                <p class="card">Service 2</p>
                <p class="card">Service 3</p>
                <p class="card">Service 4</p>
                <p class="card">Service 5</p>
                <p class="card">Service 6</p>
            </div>
        </div>
    </main>
</body>
</html>
