<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 카드</title>
    <style>

        .card {
            width: 250px;
            height: 150px;
            background-color: gainsboro;

            position: relative; 
        }

        .card-title {
            top: 60px;
            right: 80px;
            font-size: 16px;
            font-weight: 700;
            color: black;
            padding: 10px 0px 0px 15px;
        }


        .badge {
            font-weight: 900;
            font-size: 12px;
            background: red;
            color: white;

            position: absolute;
            top: 5px;
            right: 12px;

            padding: 3px 5px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-title">상품 카드</div>
        <div class="badge">NEW</div>
    </div>
    
</body>
</html>
