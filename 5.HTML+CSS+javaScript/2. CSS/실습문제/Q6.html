<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* 메인 영역 */
        .hero {
            display: flex;
            height: 100vh;
            gap: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: linear-gradient(135deg, #4446e5, #3b82f6);
        }

        /* 제목 */
        .title {
            color: white;
            font-size: 50px;
            font-weight: bold;
        }

        /* 내용 */
        .content{
            height: 50px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 버튼 */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: white;
            color: blue;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            margin: 15px 0px 0px 0px;
        }


    </style>
</head>
<body>
    <!-- 
        렌딩 페이지
            - 특정 목적을 위해 사용자가 들어오도록 유도하는 페이지
        
        히어로
            - 페이지에서 가장 강조되는 영역
        
        히어로 구조
            - 제목
            - 한줄 설명
            - CTA 버튼
            - (선택) 이미지 등
        
        CTA 버튼
            - "무료로 시작하기", "지금 시작하기", "상담 신청하기" 등 특정 행동을 하라고
                유도하는 버튼
    -->
        <div class="hero">
            <p class="title">Build Your Future</p>
            <p class="content">Start learning today and grow your career.</p>
            <a href="https://www.naver.com" class="btn">Get Started</a>

        </div>
    </div>
</body>
</html>
