<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9실습문제</title>
    <style>
        
        body{
            margin: 0;
            background-color: #007bff;
            overflow: hidden;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            padding-bottom: 15px;
        }

        .one {
            background-color: #fff;
            width: 100px;
            height: 100px;
            border-radius: 50px;
            animation: one 2.5s ease-in-out infinite alternate;
        }

        @keyframes one {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-450px);
            }
        }

    </style>
</head>
<body>

        <div class="container">
            <div class="one"></div>
        </div>
    
</body>
</html>
