<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            background-color: #87ceed;
            justify-content: center;
            align-items: center;
        }

        .progress-container {
            width: 50%;
            height: 30px;
            border-radius: 15px;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: 10px;
            background-color: aquamarine;
            animation: progressBar 5s linear 1;
        }

        @keyframes progressBar {
            0% {
                width: 0;
            }
            100% {
                width: 100%;
            }
        }

    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</body>
</html>
