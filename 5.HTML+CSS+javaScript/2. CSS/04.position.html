<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* .box {
            width: 100px;
            height: 100px;
            background-color: red;

            position: relative;
            top: 10px;
            right: 30px;
            left: 30px;
        } */

        .box2 {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            position: relative; 
            /*
                relative : 자기자신을 지점을 잡고 시작함
            */
        }

        .child-box2 {
            width: 100px;
            height: 100px;
            background-color: red;   
            
            position: absolute;
            /* absolute : 부모 격 클래스를 지점으로 삼고 시작 */
            top: 50px;
            left: 50px;
        }

        /* .box3 {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: fixed;  -> 화면에 고정. 스크롤시 고정된 상태로 같이 움직인다.
            bottom: 20px;
            right: 20px;
        } */

        #boxes {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            position: relative; 
        }

        .absolute-box {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            position: absolute; 
        }

        .box4 {
            top: 60px;
            left: 60px;
            background-color: aqua;
            z-index: 3;
        }

        .box5 {
            top: 80px;
            left: 80px;
            background-color: blueviolet;
            z-index: 2;
        }

        .box6 {
            top: 100px;
            left: 100px;
            background-color: greenyellow;
        }

    </style>
</head>
<body>
    <div class="box">box</div>

    <div class="box2">box2
        <div class="child-box2">child-box2</div>
    </div>

    <div class="box3">box3</div>

    <div id="boxes">
        <div class="absolute-box box4">box4</div>
        <div class="absolute-box box5">box5</div>
        <div class="absolute-box box6">box6</div>
    </div>
