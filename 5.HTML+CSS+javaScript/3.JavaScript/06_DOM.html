<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <div class="box-class"> Box 1 </div>
    <div class="box-class"> Box 2 </div>
    <div class="box-class"> Box 3 </div> 

    <div id="box-id">Box 4</div>

    <script>
        let box = document.getElementById("box-id");
        // 텍스트 노드 조작 종류        
        // .textContent (권장): 텍스트 노드에 값을 변경해서 사용할 수 있음.
        // .innerHTML
        // .innerText (권장하지 않음)  
        //   > 이유 : 사용자가 작성한 태그 그대로 (MySQL 저장소에) 들어가기 때문에 권장X
        box.textContent = '속성 조작중'
        // box.innerText = '<strong>innerText</strong>'  
        console.log(box.textContent);

        let boxes = document.getElementsByClassName("box-class");
        console.log(boxes);

        for(let i=0; i<boxes.length; i++) {
            console.log(boxes[i]);
        }
    </script>

<!-- ===================================================================== -->
    <hr>

    <input type="text" id="userId" placeholder="아이디를 입력해주세요.">
    <button onclick="submitId()">제출</button>
    <div id="msg"></div>

    <script>
        // 아이디가 비어있거나 20자 이상이면 안내 문구 생성하기
        
        function submitId() {
            let userId = document.getElementById("userId").value;
            let msg = document.getElementById("msg");

            // 아이디가 비어있을 때 적용
            if(userId === "") {
                // 직접 CSS 적용도 가능 (color, font-size 등)
                msg.style.color = 'red';
                msg.style.fontSize = '12px';
                msg.textContent = "아이디를 입력해주세요.";
            // 20자 이상이면 안내문구 생성 
            } else if (userId.length >= 20) {
                msg.style.color = 'red';
                msg.style.fontSize = '12px';
                msg.textContent = "아이디는 20자 미만으로 작성해주세요.";                
            }  else {
                // "사용 가능한 아이디입니다."
                //  색은 blue
                msg.style.color = 'blue';
                msg.style.fontSize = '12px';
                msg.textContent = "사용 가능한 아이디입니다";
            }
        }
    </script>
    <hr>

    <input type="text" id="todo-input">
    <button onclick="todoFunc()">추가하기</button>
    <ul id="todo-list">
        <li>먹기</li>
    </ul>

    <script>
        function todoFunc() {
            const todoInput = document.getElementById("todo-input");
            const todoList = document.getElementById("todo-list");

            console.dir(todoInput.value);

            // 요소 생성하기
            const todoItem = document.createElement("li") // .createElement("li") : <li></li> 요소가 만들어져서 저장된 상태
            todoItem.textContent = todoInput.value;  // <- <li>놀기</li> 입력한 요소들을 추가

            // ul 요소(todoList)에 li 요소(todoItem)를 자식으로 추가하기
            todoList.appendChild(todoItem);

            todoInput.value = "";
        }
    </script>

    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>이름</th>
                <th>나이</th>
            </tr>
        </thead>
        <tbody id="tbody-id">
            <!-- 여기에 추가 -->
        </tbody>
    </table>

    <input type="text" id="table-name">
    <input type="text" id="table-age">
    <button onclick="addTable()">추가하기</button>

    <script>
        function addTable() {
            // 1. 필요한 요소 가져오기
            const name = document.getElementById("table-name").value;
            const age = document.getElementById("table-age").value;
            const tbody = document.getElementById("tbody-id");

            // 2. 요소 추가하기
            const nameTd = document.createElement("td");  // <td></td> 생성
            const ageTd = document.createElement("td");  // <td></td> 생성
            const tr = document.createElement("tr");  // <tr></tr> 생성

            // 3. 텍스트 노드 추가하기
            nameTd.textContent = name;
            ageTd.textContent = age;

            // 4. 자식 요소로 추가하기 (DOM Tree에 이어붙이기)
            //  th에 작성한 속성에 맞춰 순서 그대로 입력해줘야 함. -> 이름에 나이가 들어올 수 있음.  
            tr.appendChild(nameTd);
            tr.appendChild(ageTd);

            tbody.appendChild(tr);

        }
    </script>
</body>
</html>
