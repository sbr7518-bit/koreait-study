<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 최상위 객체이기 때문에 생략 가능. 원래는 window.document.~ 식으로 작성한다. -->
    <p>window 객체 : 자바스크립트 최상위 객체</p>  

    <h3>window.open()</h3>
    <button onclick="windowFunc()">클릭</button>

    <script>
        // 클릭하면 지정된 곳으로 이동
        function windowFunc() {
            window.open("https://www.naver.com", "asd", "width=500, height=500");
        }
    </script>

    <hr>
    <h3>타이머 관련 함수</h3>
    <ol>
        <!-- 지정한 시간이 지나면 코드 실행 -->
        <li>setTimeout</li>
        <!-- 지정한 시간마다 실행시켜주는 코드 -->
        <li>setInterval</li>
    </ol>

    <button onclick="timerFunc()">클릭</button>

    <script>
        function timerFunc() {
            // 5000 =5s
            // 특정 시간이 지나고 나서 코드를 실행
            // setTimeout(() => {
            //     alert("안녕하세요")
            // }, 5000)

            const newNaver = window.open("https://www.naver.com");
            newNaver.alert("안녕하세요");
            
            setTimeout(() => {
                // 클릭시 열린 창을 지정한 시간이 지나고 다시 닫는 기능.
                newNaver.close();
            }, 5000)
        }
    </script>

    <div id="current-date"></div>
    <button onclick="currentDate()">시간 확인</button>

    <script>
        function currentDate() {
            const currentDate = document.getElementById("current-date");


            // new Date() : (시스템 상)현 시간을 보여주는 객체
            // 1초마다 특정 코드를 실행 
            // 특정 시간마다 요청하는 기능
            let intervalObj = setInterval( () => {
                                    currentDate.textContent = new Date();
                                }, 1000)

            setTimeout(() => {
                // clearInterval : interval 객체를 초기화 시켜주는 함수
                clearInterval(intervalObj);
            }, 5000)
        }
    </script>

    <hr>
    <!-- BOM : JavaScript 최상위 객체 -->
    <h3>BOM (Browser Object Model)</h3>
    <p>브라우저를 JavaScript가 제어하기 위한 객체 모델</p>
    <ol>
        <!-- DOM  : HTML 최상위 객체 -->
        <li>document (DOM)</li>
        <li>location</li>
        <li>screen</li>
        <li>navigator</li>
        <li>history</li>
    </ol>

    <!-- 새로운 페이지 요청 -->
    <button onclick="location.href='https://www.never.com'">location</button>
    <!-- 화면정보 -->
    <button onclick="console.log(screen)">스크린</button>  
    <!-- 브라우저 정보 -->
    <button onclick="console.log(navigator)">네비게이터</button>
    <!-- 브라우저를 사용 기록을 담고 있는 내용 -->
    <button onclick="console.log(history)">히스토리</button>
    <!-- 이전 페이지로 이동 => ex. 취소 버튼에 주로 사용 -->
    <button onclick="history.back()">히스토리</button>

</body>
</html>
