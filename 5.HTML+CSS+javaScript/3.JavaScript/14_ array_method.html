<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let scores = [84,56,78,90,45];
        
        // scores 배열에서 각각의 요소에 2를 곱한 리스트 반환
        let doubledScores = scores.map((score) => score * 2);

        // scores 배열에서 70점을 초과하는 요소만 리스트 반환
        let passScores = scores.filter((score) => score > 70);

        // scores 배열에서 모든 점수의 (누적된)합계 반환
        let sumScores = scores.reduce((total, score) => total + score, 0);


        console.log(doubledScores);
        console.log(passScores);
        console.log(sumScores);

        let students = [
            {
                name : "김재섭",
                score : 70
            },
            {
                name : "짱구",
                score : 50
            },
            {
                name : "철수",
                score : 97
            }
        ]

        // 객체 안에 있는 특정요소를 불러오기 위해선 .변수명을 직접 지정해주어야 한다.
        let topStudents = students.filter((student) => student.score >= 70);
        console.log(topStudents);


        // students 배열에서 성적의 합계 구하기 (reduce)

        // let totalStudents = students.reduce((total, {score}) => total + score, 0);
        let reduceStudents = students.reduce((total, student) => total + student.score, 0);
        console.log(reduceStudents);
        
        // students 배열에서 각각의 요소(score)에 5점 추가(+=)하여 반환 (map)
        // let pulsStudents = students.map(({score}) => score += 5);
        let mapStudents = students.map((student) => student.score += 5);
        console.log(mapStudents);
        


</script>

</body>
</html>
