# 서비스의 이름은 nginx-final-service
# NodePort 사용
# nginx-final 이라는 label을 가진 pod 추적
# 30002 포트로 받은 요청을 nginx-final(80 port)로 접근


apiVersion: v1
kind: Service
metadata:
  name: nginx-final-service


spec:
  type: NodePort
  selector:
    app: nginx-final
  ports:
    - port: 80           # Service 내부 포트
      targetPort: 80     # Pod 컨테이너 포트
      nodePort: 30002     # 외부에서 노드에 접근할 때 사용하는 포트